    <rect x="432" y="68" width="272" height="92" rx="6" fill="#f3e7e3" stroke="#bf4520"/>
    <g fill="#ececec" stroke="#bfc0c0">
      <rect x="28" y="248" width="220" height="56" rx="6"/>
      <rect x="432" y="248" width="272" height="56" rx="6"/>
