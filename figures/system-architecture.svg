<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" role="img" aria-labelledby="system-architecture-title system-architecture-desc" id="system-architecture-root">
  <title id="system-architecture-title">Inference serving and benchmark architecture</title>
  <desc id="system-architecture-desc">The benchmark client sends authenticated chat requests to vLLM on Modal and receives streamed responses. Client results and Prometheus snapshots feed offline analysis.</desc>
  <defs>
    <marker id="system-architecture-http-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#2e5aa8"/>
    </marker>
    <marker id="system-architecture-data-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4f5d75"/>
    </marker>
  </defs>
  <rect width="760" height="416" rx="8" fill="#f5f5f5"/>
  <path d="M28 204H732" stroke="#bfc0c0"/>
  <rect x="404" y="28" width="328" height="156" rx="8" fill="#ececec" stroke="#4f5d75" stroke-dasharray="5 4"/>
